[package]
name = "vacuity-checker"
version = "0.1.0"
edition = "2024"

[dependencies]
proc-macro2 = { version = "1.0.107", features = ["span-locations"] }
quote = "1.0.47"
serde = { version = "1.0.229", features = ["derive"] }
